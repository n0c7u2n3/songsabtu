    <main id="desktop" aria-label="Windows desktop">
      <div id="desktop-icons" aria-label="Desktop shortcuts"></div>
      <div id="windows"></div>
    </main>
    <footer id="taskbar">
      <button
        id="start-button"
        aria-expanded="false"
        aria-controls="start-menu"
      >
        <img src="assets/windows-0.png" alt="" /><b>Start</b>
      </button>
      <div class="taskbar-divider"></div>
      <button
        id="show-desktop"
        class="quick-launch"
        title="Show desktop"
        aria-label="Show desktop"
      >
        <img src="assets/desktop-0.png" alt="" />
      </button>
      <div class="taskbar-divider"></div>
      <div id="tasks" aria-label="Open windows"></div>
      <div id="tray" class="sunken">
        <button id="volume-button" title="Volume" aria-label="Volume">
          <img src="assets/loudspeaker_rays-0.png" alt="" /></button
        ><time id="clock"></time>
      </div>
    </footer>
    <nav id="start-menu" class="raised" aria-label="Start menu" hidden="">
      <div class="start-banner"><b>Windows</b><span>98</span></div>
      <div id="start-items"></div>
    </nav>
    <div id="popup" class="raised" hidden=""></div>
    <div id="volume-panel" class="raised" hidden="">
      <label for="master-volume">Volume</label
      ><input
        id="master-volume"
        type="range"
        min="0"
        max="1"
        step="0.05"
        value="0.7"
      /><label><input id="mute" type="checkbox" /> Mute</label>
    </div>
